[package]
name = "mayarin-payment-router"
version = "0.1.0"
description = "Solana Anchor port of Mayarin PaymentRouter"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "mayarin_payment_router"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "anchor-spl/token_2022",
]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "token_2022"] }
# Solana 2.1's bundled SBF toolchain is Rust/Cargo 1.79. These direct pins keep
# Anchor's transitive graph below the Edition-2024 / Rust-1.85 boundary.
blake3 = "=1.8.2"
indexmap = "=2.7.1"
proc-macro-crate = "=3.3.0"
unicode-segmentation = "=1.12.0"
zeroize = "=1.8.1"
zeroize_derive = "=1.4.2"

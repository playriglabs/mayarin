# Security gates (SEC-21). A scanner that cannot run is a failure, not a pass:
# every job exits non-zero on a tool or parser error as well as on a finding.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: known vulnerabilities in bun.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Report-only for now: on 18 Oct 2026 the lockfile already carries 32
      # packages with advisories, almost all transitive build tooling. Blocking
      # would be red from day one and ignored. Drop `continue-on-error` once the
      # list is triaged (osv-scanner.toml for the accepted ones).
      - continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.0.3 \
            scan source --lockfile bun.lock

  secrets:
    name: committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.24.3 \
            git --redact --no-banner --exit-code 1

  contracts:
    name: contract tests and Slither
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts/payment-router
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # OpenZeppelin is resolved from the repo-root node_modules (foundry.toml).
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: forge test
      # Pinned to the version the findings in docs/contract-review.md were
      # triaged against. --fail-none passes on findings (24 are reviewed and
      # accepted there) but a compile or parser failure still fails the job.
      - run: |
          pip install slither-analyzer==0.11.6 solc-select
          solc-select install 0.8.28
          solc-select use 0.8.28
          slither . --config-file slither.config.json --fail-none

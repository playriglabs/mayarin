name: docs

on:
  pull_request:
    paths:
      - apps/docs/**
      - packages/sdk/src/**
      - apps/api/src/dto/**
      - apps/api/src/routes/**
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - packages/sdk/src/**
      - apps/api/src/dto/**
      - apps/api/src/routes/**

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: build & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5

      - run: bun install --frozen-lockfile

      # Fails when the checked-in openapi.json is stale relative to the live
      # API request schemas and the generator. Also validates the document:
      # the docs build below loads it through fumadocs-openapi, so a malformed
      # OpenAPI document fails the build.
      - run: bun run docs:openapi:check

      # Typechecks the docs app, including the OpenAPI generator script and
      # the fumadocs-typescript auto-type-tables that resolve SDK exports from
      # packages/sdk/src — a missing or renamed public export fails here.
      - run: bun run --cwd apps/docs typecheck

      - run: bun run build:docs

services:
  postgres:
    image: postgres:16-alpine
    container_name: mayarin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mayarin
      POSTGRES_PASSWORD: mayarin
      POSTGRES_DB: mayarin
    ports:
      - "5433:5432"
    volumes:
      - mayarin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mayarin -d mayarin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mayarin-pgdata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: mayarr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mayarr
      POSTGRES_PASSWORD: mayarr
      POSTGRES_DB: mayarr
    ports:
      - "5432:5432"
    volumes:
      - mayarr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mayarr -d mayarr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mayarr-pgdata:
